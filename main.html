<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribe markdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">

</head>
<style>
    .hidden {
        display: none;
    }
</style>

<body class="bg-[#101922]">
    <section id="welcomePage" class=" flex hidden justify-center items-center flex-col gap-y-10 py-24">
        <div class="w-24 h-28 rounded-md bg-[#102336]"></div>
        <div class="text-[3rem] text-white font-bold text-center">Scribe Markdown</div>
        <div class="text-blue-200 font-awesome text-[1.2rem] text-center">Your minimalist desktop markdown editor for
            clean, <br> focused writing.</div>
        <div>
            <!-- From Uiverse.io by Javierrocadev -->
            <div class="flex flex-row gap-2">
                <div class="w-4 h-4 rounded-full bg-blue-700 animate-bounce [animation-delay:.7s]"></div>
                <div class="w-4 h-4 rounded-full bg-blue-700 animate-bounce [animation-delay:.3s]"></div>
                <div class="w-4 h-4 rounded-full bg-blue-700 animate-bounce [animation-delay:.7s]"></div>
            </div>
        </div>
    </section>
    <section id="editorHomePage" class="flex">
        <div id="sideBar"
            class=" border-[1px] border-l border-[#102336] p-3 w-[20%] hidden sticky left-0 top-0 sm:flex sm:flex-col sm:justify-between sm:h-[100vh]">
            <div class="flex gap-x-4">
                <span class="bg-[#102336] w-20 h-24 rounded-md"></span>
                <span class="flex justify-center items-center flex-col">
                    <p class="text-[1.5rem] text-white font-bold">Markdown</p>
                    <p class="text-blue-200 font-awesome text-[.9rem]">Local Editor</p>
                </span>
            </div>

            <button id="newFileButton" type="button"
                class=" p-4 text-white bg-blue-700 text-[1.1rem] rounded-md active:bg-blue-300"> + New document</button>
        </div>
        <main class="px-8 w-[100%] h-auto gap-y-8 flex flex-col sm:w-[80%]">
            <div id="navBar"
                class="w-full border-b border-[#102336] h-16  flex  items-center p-5 sticky top-0 backdrop-blur-2xl">
                <input type="text" name="" id="searchInput" placeholder="&#xf002; Search your files..."
                    class="w-full sm:w-96 p-2 bg-transparent border-[#102336] border-[1px] text-white outline-none rounded-[10px] font-['Font_Awesome_6_Free'] font-black placeholder:font-['Font_Awesome_6_Free'] placeholder:font-black">
            </div>
            <div class="flex flex-col gap-3 justify-between sm:flex-row">
                <span>
                    <p class="text-[2.5rem] text-white font-bold">Welcome Back!</p>
                    <p class="text-blue-200 font-awesome text-[1.1rem]">Pick up where you left off or start something
                        new.</p>
                </span>
                <span class="flex justify-center items-center">
                    <button id="newFileButton" type="button"
                        class="w-60 p-4 text-white bg-blue-700 text-[1.1rem] rounded-md active:bg-blue-300"> + New
                        document</button>
                </span>
            </div>
            <div class="flex justify-between">
                <span class="text-[1.2rem] text-white font-bold">Recent documents</span>
                <span><button class="bg-transparent text-blue-500" type="button" id="viewAll">View All</button></span>
            </div>
            <div id="files" class="flex  gap-4">
                <div class="flex flex-col ">
                    <span class="bg-[#0f1a30] w-64 h-48 rounded-xl hover:bg-[#0f192e]"></span>
                    <span id="fileName" class="text-[1.5rem] text-white font-bold">File_name</span>
                </div>
                <div class="flex flex-col gap-y-2">
                    <span class="bg-[#0f1a30] w-64 h-48 rounded-xl hover:bg-[#0f192e]"></span>
                    <span id="fileName" class="text-[1.5rem] text-white font-bold">File_name</span>
                </div>
                <div class="flex flex-col gap-y-2">
                    <span class="bg-[#0f1a30] w-64 h-48 rounded-xl hover:bg-[#0f192e]"></span>
                    <span id="fileName" class="text-[1.5rem] text-white font-bold">File_name</span>
                </div>
                <div class="flex flex-col gap-y-2">
                    <span class="bg-[#0f1a30] w-64 h-48 rounded-xl hover:bg-[#0f192e]"></span>
                    <span id="fileName" class="text-[1.5rem] text-white font-bold">File_name</span>
                </div>
            </div>
            <div id="newfile" class=" text-[1.1rem] font-extrabold text-white flex flex-col justify-center items-center border-dashed border-[1px] border-[#102336] bg-transparent w-64 h-48 rounded-xl px-8 hover:bg-blue-700 hover:delay-150 acive:bg-blue-300 ">
                <p>+</p>
                <p>Create New</p>
            </div>
        </main>
    </section>
    <section id="markdownInterface" class="none"></section>
</body>
<!-- <script src="main.js"></script> -->

</html>
