<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribe markdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="flex justify-center items-center">
  <div id="modal" class=" text-center flex flex-col gap-y-4 bg-[#1e293b] shadow-lg p-10 justify-center items-center text-white rounded-xl h-[30em] w-[30em] relative top-[100px] backdrop-blur-2xl ">
    <button type="button" class="size absolute top-5 right-10 p-2 rounded-full text-gray-400 hover:text-white transition-colors">&#x2715;</button>
    <span class="text-[2rem] font-extrabold align-center">Welcome to MarkdownStudio!</span>
    <span class="align-center">Let's get your workspace set up and ready for your first masterpiece.</span>
    <span class="flex flex-col gap-y-2 text-left">
        <p class="font-bold">Your name</p>
         <input type="text" name="Username" id="userName" placeholder="Enter your name" class=" active:outline-blue-400 bg-[#0f172a] p-2 rounded-md outline-none text-white w-96 h-[50px]">
    </span>
    <button type="button" id="getStarted" class="w-52 h-10 bg-[#3b82f6] font-bold text-white rounded-lg hover:opacity-[.5] active:opacity-[1]">Get Started</button>
</div>
</body>
